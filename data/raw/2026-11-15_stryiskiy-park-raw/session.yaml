date: 2026-11-15
location: Stryiskyi Park
environment: outdoor
lighting: sunny, clear sky
surface: ground and asphalt roads in Stryiskyi Park, with leaves and branches
rover_code_commit: https://github.com/UCUSpaceRobotics/indomitus-rover-core/commit/f765b007752b7b94756ffdf376fb5d1ad4c05d0b
zed_config: zed2i_record.yaml
notes: |
  - Raw recordings, nothing was changed after recording.
  - 08ms bags: max_linear_speed was set to 0.8 in controllers.yaml (the only change in the commit above), but the gamepad scale stayed 1.0. The controller limits the requested speed to 0.8, but /rover/cmd_vel still reaches 1.0 and does not match the real speed (about 0.8). The limited command is not recorded.
  - 10ms bags: max_linear_speed was 1.0, so /rover/cmd_vel matches the speed limit. Only turning commands go up to 3% over it.
  - because of the incorrectly recorded control commands all bags from this run are excluded in the manifest.csv.
  - Some bags have short gaps or late-starting topics in the first ~3 s of the recording, so they may need trimming at the start.
  - Several bags have pose jumps in /rover/odom, and in some bags the ZED odometry path is much shorter than the wheel odometry path. Check the odometry before using it for labels.
