date: 2026-11-15
location: Stryiskyi Park
environment: outdoor
lighting: sunny, clear sky
surface: ground and asphalt roads in Stryiskyi Park; areas with leaves and branches
rover_code_commit: https://github.com/UCUSpaceRobotics/indomitus-rover-core/commit/f765b007752b7b94756ffdf376fb5d1ad4c05d0b
zed_config: zed2i_record.yaml
notes: |
  - Same recordings as in 2026-11-15_stryiskiy-park-raw, with /rover/cmd_vel corrected for the 08ms bags. All other topics are unchanged.
  - 08ms bags: max_linear_speed was set to 0.8 in controllers.yaml (the only change in the commit above), but the gamepad scale stayed 1.0, so the recorded /rover/cmd_vel reached 1.0. It was clamped offline to 0.8 with scripts/clamp_cmd_vel.py, the same way the controller does it: the whole twist is scaled so that sqrt(vx^2 + vy^2 + (0.512 * wz)^2) <= 0.8. The controller's acceleration and jerk smoothing is not applied, so the real speed follows the command with a delay of about 0.2-0.6 s.
  - 10ms bags: max_linear_speed was 1.0, so /rover/cmd_vel was not changed. Only turning commands go up to 3% over the limit.
  - mixed_outdoor_08ms_1_20261115_133726 (excluded in the manifest.csv): the speed command changes often (about 41 changes per minute, roughly 27% of the moving time is within 2 s of a change), so the controller smoothing, which is not accounted for here, affects the real speed more than in the other bags.
